<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>عدن عقار - رفع الصور والربط مع GitHub</title>
  <style>
    * { box-sizing: border-box; font-family: Tahoma, Arial, sans-serif; }
    body { margin: 0; background: #f4f6f9; color: #1f2937; padding: 16px; }
    .container { max-width: 780px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
    h1, h2, h3 { margin-top: 0; color: #0f172a; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; align-items: center; }
    input[type="text"], input[type="password"], input[type="file"] {
      flex: 1; min-width: 200px; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px;
    }
    button {
      padding: 10px 14px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px;
      background: #2563eb; color: #fff; transition: 0.2s;
    }
    button:hover { background: #1d4ed8; }
    button.secondary { background: #475569; }
    button.secondary:hover { background: #334155; }
    button.success { background: #16a34a; }
    button.success:hover { background: #15803d; }
    button.danger { background: #dc2626; }
    button.danger:hover { background: #b91c1c; }
    .box { border: 1px solid #e2e8f0; background: #f8fafc; border-radius: 10px; padding: 14px; margin-top: 14px; }
    .status { margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: #eff6ff; border: 1px solid #bfdbfe; font-size: 13px; white-space: pre-wrap; word-break: break-word; }
    .status.error { background: #fef2f2; border-color: #fecaca; color: #991b1b; }
    .status.success { background: #f0fdf4; border-color: #bbf7d0; color: #166534; }
    .hidden { display: none; }
    .preview-img { max-width: 100%; max-height: 240px; border-radius: 8px; margin-top: 10px; display: none; border: 1px solid #cbd5e1; }
  </style>
</head>
<body>
  <div class="container">
    <h2>لوحة إدارة رفع الصور (aden-aqar)</h2>

    <!-- بوابة الدخول للأدمن -->
    <div id="adminLockBox" class="box">
      <label for="adminCodeInput"><strong>أدخل شفرة الدخول للأدمن:</strong></label>
      <div class="row" style="margin-top: 8px; margin-bottom: 0;">
        <input type="password" id="adminCodeInput" placeholder="أدخل الشفرة هنا" />
        <button type="button" onclick="unlockAdmin()">دخول الأدمن</button>
      </div>
      <div id="lockMsg" class="status hidden"></div>
    </div>

    <!-- لوحة الأدمن -->
    <div id="adminPanel" class="box hidden">
      <div class="row" style="justify-content: space-between;">
        <strong>إعدادات GitHub Token والمستودع</strong>
        <button type="button" class="danger" onclick="resetAdminSession()">إعادة ضبط / خروج الأدمن</button>
      </div>

      <div class="row">
        <input type="password" id="adminGhTokenInput" placeholder="الصق رمز GitHub Token هنا (github_pat_...)" />
        <button type="button" id="toggleRevealBtn" class="secondary" onclick="handleRevealToken()">طلب إظهار التوكن</button>
        <button type="button" class="success" onclick="saveGitHubToken()">حفظ التوكن</button>
      </div>

      <div class="row" style="margin-bottom: 0;">
        <button type="button" onclick="checkRepoAndTokenStatus()">فحص المستودع والتوكن</button>
        <button type="button" class="secondary" onclick="clearSavedToken()">مسح التوكن المحفوظ</button>
      </div>

      <div id="adminGhTokenStatus" class="status">جاهز للفحص وحفظ التوكن.</div>
    </div>

    <!-- قسم رفع الصور -->
    <div id="uploadSection" class="box">
      <h3>رفع صورة إلى المستودع</h3>
      <div class="row">
        <input type="file" id="imageFileInput" accept="image/*" onchange="previewSelectedImage()" />
        <button type="button" class="success" id="uploadBtn" onclick="uploadImageToGitHub()">رفع الصورة الآن</button>
      </div>
      <img id="imagePreview" class="preview-img" alt="معاينة الصورة" />
      <div id="uploadMsg" class="status">اختر صورة ثم اضغط رفع الصورة الآن.</div>
    </div>
  </div>
  <script>
    const GITHUB_OWNER = 'aden-aqar';
    const GITHUB_REPO = 'aden-aqar';
    const GITHUB_BRANCH = 'main';
    const UPLOAD_FOLDER = 'uploads';
    const ADMIN_CODE = '9270268911';
    const TOKEN_STORAGE_KEY = 'aden_aqar_gh_token';

    let isAdminUnlocked = false;
    let isTokenRevealed = false;

    function setStatus(elId, text, type = '') {
      const el = document.getElementById(elId);
      if (!el) return;
      el.className = 'status' + (type ? ' ' + type : '');
      el.textContent = text;
    }

    function cleanToken(raw) {
      return (raw || '').trim().replace(/^Bearer\s+/i, '');
    }

    function getSavedToken() {
      return cleanToken(localStorage.getItem(TOKEN_STORAGE_KEY) || '');
    }

    function unlockAdmin() {
      const codeInput = document.getElementById('adminCodeInput');
      const entered = (codeInput ? codeInput.value : '').trim();
      const lockMsg = document.getElementById('lockMsg');

      if (entered === ADMIN_CODE) {
        isAdminUnlocked = true;
        document.getElementById('adminLockBox').classList.add('hidden');
        document.getElementById('adminPanel').classList.remove('hidden');
        if (lockMsg) lockMsg.classList.add('hidden');

        const saved = getSavedToken();
        const tokenInput = document.getElementById('adminGhTokenInput');
        if (saved && tokenInput) {
          tokenInput.value = saved;
          setStatus('adminGhTokenStatus', 'تم تحميل التوكن المحفوظ مسبقاً. يمكنك الضغط على "فحص المستودع والتوكن" للتأكد.', 'success');
        } else {
          setStatus('adminGhTokenStatus', 'لا يوجد توكن محفوظ حالياً. الصق رمز GitHub Token ثم اضغط "حفظ التوكن".');
        }
      } else {
        if (lockMsg) {
          lockMsg.classList.remove('hidden');
          setStatus('lockMsg', 'شفرة الدخول غير صحيحة.', 'error');
        }
      }
    }

    function resetAdminSession() {
      isAdminUnlocked = false;
      isTokenRevealed = false;
      const tokenInput = document.getElementById('adminGhTokenInput');
      if (tokenInput) {
        tokenInput.type = 'password';
      }
      const revealBtn = document.getElementById('toggleRevealBtn');
      if (revealBtn) revealBtn.textContent = 'طلب إظهار التوكن';

      document.getElementById('adminPanel').classList.add('hidden');
      document.getElementById('adminLockBox').classList.remove('hidden');
      document.getElementById('adminCodeInput').value = '';
    }

    function handleRevealToken() {
      const tokenInput = document.getElementById('adminGhTokenInput');
      const revealBtn = document.getElementById('toggleRevealBtn');
      if (!tokenInput || !revealBtn) return;

      if (!isTokenRevealed) {
        tokenInput.type = 'text';
        isTokenRevealed = true;
        revealBtn.textContent = 'إخفاء التوكن';
      } else {
        tokenInput.type = 'password';
        isTokenRevealed = false;
        revealBtn.textContent = 'طلب إظهار التوكن';
      }
    }

    function saveGitHubToken() {
      const tokenInput = document.getElementById('adminGhTokenInput');
      const cleaned = cleanToken(tokenInput ? tokenInput.value : '');
      if (!cleaned) {
        setStatus('adminGhTokenStatus', 'يرجى لصق رمز GitHub Token أولاً قبل الحفظ.', 'error');
        return;
      }
      localStorage.setItem(TOKEN_STORAGE_KEY, cleaned);
      if (tokenInput) tokenInput.value = cleaned;
      setStatus('adminGhTokenStatus', 'تم حفظ التوكن محلياً بنجاح. اضغط الآن "فحص المستودع والتوكن".', 'success');
    }

    function clearSavedToken() {
      localStorage.removeItem(TOKEN_STORAGE_KEY);
      const tokenInput = document.getElementById('adminGhTokenInput');
      if (tokenInput) tokenInput.value = '';
      setStatus('adminGhTokenStatus', 'تم مسح التوكن المحفوظ من المتصفح.');
    }
    function getAuthHeaders(token) {
      return {
        'Authorization': 'Bearer ' + token,
        'Accept': 'application/vnd.github+json',
        'X-GitHub-Api-Version': '2022-11-28',
        'Content-Type': 'application/json'
      };
    }

    async function checkRepoAndTokenStatus() {
      const tokenInput = document.getElementById('adminGhTokenInput');
      const token = cleanToken((tokenInput && tokenInput.value) || getSavedToken());

      if (!token) {
        setStatus('adminGhTokenStatus', 'لا يوجد رمز GitHub Token مدخل أو محفوظ. ألصق التوكن أولاً ثم اضغط حفظ.', 'error');
        return;
      }

      setStatus('adminGhTokenStatus', 'جاري فحص التوكن والمستودع والفرع...');

      try {
        // 1. التحقق من هوية التوكن
        const userRes = await fetch('https://api.github.com/user', {
          headers: getAuthHeaders(token)
        });

        if (!userRes.ok) {
          const errText = await userRes.text();
          setStatus(
            'adminGhTokenStatus',
            `فشل التحقق من التوكن (رمز الحالة: ${userRes.status}). تأكد من نسخ التوكن كاملاً دون مسافات ومن أنه لم ينتهِ أو يُجدد.\nالتفاصيل: ${errText}`,
            'error'
          );
          return;
        }

        const userData = await userRes.json();

        // 2. التحقق من المستودع والفرع
        const repoUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/branches/${encodeURIComponent(GITHUB_BRANCH)}`;
        const repoRes = await fetch(repoUrl, {
          headers: getAuthHeaders(token)
        });

        if (repoRes.status === 404) {
          setStatus(
            'adminGhTokenStatus',
            `التوكن صحيح (الحساب: ${userData.login})، لكن تعذر العثور على المستودع أو الفرع (404):\nالمسار المفحوص: ${GITHUB_OWNER}/${GITHUB_REPO} (الفرع: ${GITHUB_BRANCH}).\nتأكد من أن الفرع اسمه "${GITHUB_BRANCH}" وأن المستودع مضاف ضمن Repository access في التوكن.`,
            'error'
          );
          return;
        }

        if (!repoRes.ok) {
          const errText = await repoRes.text();
          setStatus(
            'adminGhTokenStatus',
            `تعذر الوصول للفرع (رمز الحالة: ${repoRes.status}).\nالتفاصيل: ${errText}`,
            'error'
          );
          return;
        }

        const branchData = await repoRes.json();
        setStatus(
          'adminGhTokenStatus',
          `نجح الفحص بالكامل!\nالحساب المتصل: ${userData.login}\nالمستودع: ${GITHUB_OWNER}/${GITHUB_REPO}\nالفرع: ${branchData.name}\nيمكنك الآن رفع الصور بأمان.`,
          'success'
        );
      } catch (err) {
        setStatus(
          'adminGhTokenStatus',
          `حدث خطأ في الشبكة أثناء الفحص: ${err && err.message ? err.message : err}`,
          'error'
        );
      }
    }
    function previewSelectedImage() {
      const fileInput = document.getElementById('imageFileInput');
      const previewImg = document.getElementById('imagePreview');
      const file = fileInput && fileInput.files ? fileInput.files[0] : null;

      if (!file) {
        if (previewImg) {
          previewImg.src = '';
          previewImg.style.display = 'none';
        }
        return;
      }

      const reader = new FileReader();
      reader.onload = function (e) {
        if (previewImg) {
          previewImg.src = e.target.result;
          previewImg.style.display = 'block';
        }
      };
      reader.readAsDataURL(file);
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const result = String(reader.result || '');
          const base64Part = result.includes(',') ? result.split(',')[1] : result;
          resolve(base64Part);
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function sanitizeFileName(name) {
      return String(name || 'image.jpg')
        .toLowerCase()
        .replace(/[^a-z0-9._-]/g, '_')
        .replace(/_+/g, '_');
    }

    async function uploadImageToGitHub() {
      const fileInput = document.getElementById('imageFileInput');
      const uploadBtn = document.getElementById('uploadBtn');
      const file = fileInput && fileInput.files ? fileInput.files[0] : null;
      const token = getSavedToken();

      if (!token) {
        setStatus('uploadMsg', 'لم يتم العثور على رمز GitHub Token محفوظ. ادخل لوحة الأدمن واحفظ التوكن أولاً.', 'error');
        return;
      }

      if (!file) {
        setStatus('uploadMsg', 'يرجى اختيار صورة أولاً قبل الضغط على رفع الصورة.', 'error');
        return;
      }

      if (!file.type || !file.type.startsWith('image/')) {
        setStatus('uploadMsg', 'الملف المختار ليس صورة صالحة.', 'error');
        return;
      }

      try {
        if (uploadBtn) uploadBtn.disabled = true;
        setStatus('uploadMsg', 'جاري تجهيز الصورة ورفعها إلى المستودع...');

        const base64Content = await fileToBase64(file);
        const safeName = sanitizeFileName(file.name);
        const uniqueName = `${Date.now()}_${safeName}`;
        const filePath = `${UPLOAD_FOLDER}/${uniqueName}`;
        const apiUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${filePath}`;

        const response = await fetch(apiUrl, {
          method: 'PUT',
          headers: getAuthHeaders(token),
          body: JSON.stringify({
            message: `Upload image ${uniqueName} via aden-aqar`,
            content: base64Content,
            branch: GITHUB_BRANCH
          })
        });

        const data = await response.json();

        if (!response.ok) {
          setStatus(
            'uploadMsg',
            `فشل رفع الصورة (رمز الحالة: ${response.status}).\nالرسالة: ${data && data.message ? data.message : 'خطأ غير معروف'}`,
            'error'
          );
          return;
        }

        const rawUrl = data.content && data.content.download_url
          ? data.content.download_url
          : `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${filePath}`;

        setStatus(
          'uploadMsg',
          `تم رفع الصورة بنجاح!\nالمسار في المستودع: ${filePath}\nرابط الصورة المباشر:\n${rawUrl}`,
          'success'
        );
      } catch (err) {
        setStatus(
          'uploadMsg',
          `حدث خطأ أثناء رفع الصورة: ${err && err.message ? err.message : err}`,
          'error'
        );
      } finally {
        if (uploadBtn) uploadBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
